<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Styling Assignment</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        /* Paragraph 2 */
        .internal-paragraph {
            color: orange;
            font-weight: bold;
        }

        /* Highlight 2 */
        .internal-h1 {
            color: green;
            text-transform: uppercase;
        }

        /* Building 2 */
        .internal-h3 {
            color: brown;
        }
    </style>
</head>

<body>

    <h2>Paragraphs</h2>

    <!-- Paragraph 1 - Inline CSS -->
    <p style="color: blue; font-style: italic;">
        Paragraph 1
    </p>

    <!-- Paragraph 2 - Internal CSS -->
    <p class="internal-paragraph">
        Paragraph 2
    </p>

    <!-- Paragraph 3 - External CSS -->
    <p class="external-paragraph">
        Paragraph 3
    </p>


    <h2>Highlights</h2>

    <!-- Highlight 1 - Inline CSS -->
    <h1 style="color: red;">
        Highlight 1
    </h1>

    <!-- Highlight 2 - Internal CSS -->
    <h1 class="internal-h1">
        Highlight 2
    </h1>

    <!-- Highlight 3 - External CSS -->
    <h1 class="external-h1">
        Highlight 3
    </h1>


    <h2>Buildings</h2>

    <!-- Building 1 - Inline CSS -->
    <h3 style="color: purple;">
        Building 1
    </h3>

    <!-- Building 2 - Internal CSS -->
    <h3 class="internal-h3">
        Building 2
    </h3>

    <!-- Building 3 - External CSS -->
    <h3 class="external-h3">
        Building 3
    </h3>

</body>
</html>
